version: "2"
formatters:
  enable:
    - gofmt
    - goimports
    - golines
linters:
  enable:
    - exhaustive
    - exhaustruct_v5
    - errname
    - errorlint
    - errchkjson
    - embeddedstructfieldcheck
    - containedctx
  settings:
    exhaustruct_v5:
      enforce-patterns:
        - .*Params
      explicit-mode: true
    staticcheck:
      checks:
        - "all"
        - "-ST1000"
        - "-ST1003"
        - "-ST1016"
        - "-ST1020"
        - "-ST1021"
        - "-ST1022"
        - "-ST1023"
        - "-QF1001"

