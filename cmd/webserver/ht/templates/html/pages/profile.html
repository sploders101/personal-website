<!DOCTYPE html>
<html class="{{.DailyTheme}} eye-candy">
  <head>
    <title>Layers Beneath - Profile</title>
    {{ template "globalhead" . }}
    <meta
      name="description"
      content="Manage your profile"
    />
  </head>
  <body class="flex column nowrap center">
    <div class="contentbox-container margin-auto">
      <div class="contentbox-double-borders contentbox-decoration-anchor">
        <div class="contentbox-innerwindow">
          <div class="window-decorations">
            <div class="spacer"></div>
            <img
              class="window-decoration"
              src="/decorations/minimize.svg?color=FFFFFF"
            />
            <img
              class="window-decoration"
              src="/decorations/maximize.svg?color=FFFFFF"
            />
            <img
              class="window-decoration"
              src="/decorations/close.svg?color=FFFFFF"
            />
          </div>
          {{ template "nav" . }}
          <main>
            <div class="flex row wrap f-align-start">
              <div class="flex column nowrap f-grow f-align-start gap-1">
                <h1>Welcome, {{.User.Username}}!</h1>
                <table>
                  <tbody>
                    <tr>
                      <td>Username:</td>
                      <td>{{.User.Username}}</td>
                    </tr>
                    <tr>
                      <td>Email:</td>
                      <td>{{.User.Email}}</td>
                    </tr>
                    <tr>
                      <td>Registered at:</td>
                      <td>{{.User.CreatedAt}}</td>
                    </tr>
                  </tbody>
                </table>
                <a href="/profile/edit/" class="button">Edit</a>
              </div>
              <div class="visbox flex column gap-half">
                <h6>Actions</h6>
                <form action="/logout" method="POST">
                  {{.CsrfField}}
                  <input type="submit" value="Log out">
                </form>
              </div>
            </div>
          </main>
        </div>
      </div>
    </div>
  </body>
</html>
