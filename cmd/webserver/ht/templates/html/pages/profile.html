<!DOCTYPE html>
<html class="{{.DailyTheme}} eye-candy">
  <head>
    <title>Layers Beneath</title>
    {{ template "globalhead" . }}
    <meta name="description" content="In which I showcase my projects & deep-dive into technical concepts.">
  </head>
  <body class="flex column nowrap center">
    <div class="contentbox-container margin-auto">
      <div class="contentbox-double-borders contentbox-decoration-anchor">
        <div class="contentbox-innerwindow">
          <div class="window-decorations">
            <div class="spacer"></div>
            <img class="window-decoration" src="/decorations/minimize.svg?color=FFFFFF">
            <img class="window-decoration" src="/decorations/maximize.svg?color=FFFFFF">
            <img class="window-decoration" src="/decorations/close.svg?color=FFFFFF">
          </div>
          {{ template "nav" . }}
          <main>
            <h1>Welcome, {{.User.Username}}!</h1>
            <table>
              <tbody>
                <tr>
                  <td> Username: </td>
                  <td> {{.User.Username}} </td>
                </tr>
                <tr>
                  <td> Email: </td>
                  <td> {{.User.Email}} </td>
                </tr>
                <tr>
                  <td> Registered at: </td>
                  <td> {{.User.CreatedAt}}</td>
                </tr>
              </tbody>
            </table>
          </main>
        </div>
      </div>
    </div>
  </body>
</html>
